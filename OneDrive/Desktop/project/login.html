<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auralyx</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(-45deg,#0f172a,#111827,#1e293b,#0b1120);
    background-size:400% 400%;
    animation:bgMove 12s ease infinite;
    overflow-y:auto;
    overflow-x:hidden;
    padding:30px 0;
}

@keyframes bgMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

body::before,
body::after{
    content:"";
    position:absolute;
    border-radius:50%;
    filter:blur(100px);
}

body::before{
    width:250px;
    height:250px;
    background:#84fab0;
    top:-80px;
    left:-80px;
}

body::after{
    width:300px;
    height:300px;
    background:#8fd3f4;
    bottom:-100px;
    right:-100px;
}

.container{
    width:350px;
    text-align:center;
    padding:20px;
}

.logo{
    font-family:'Orbitron',sans-serif;
    font-size:55px;
    font-weight:900;
    letter-spacing:4px;
    margin-bottom:10px;
    background:linear-gradient(
        90deg,
        #ff9a9e,
        #fad0c4,
        #84fab0,
        #8fd3f4
    );
    background-size:300%;
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:shine 5s linear infinite;
     text-shadow:0 0 20px rgba(132,250,176,0.5);
}

@keyframes shine{
    from{background-position:0%;}
    to{background-position:300%;}
}

.tagline{
    color:#d1d5db;
    font-size:13px;
    letter-spacing:4px;
    margin-bottom:30px;
    text-transform:uppercase;
}

input{
    width:100%;
    padding:14px;
    margin:10px 0;
    border:none;
    border-bottom:2px solid rgba(255,255,255,0.3);
    background:transparent;
    color:white;
    outline:none;
}

input:focus{
    border-bottom:2px solid #84fab0;
}

input::placeholder{
    color:#cbd5e1;
}

button{
    width:100%;
    padding:16px;
    margin-top:15px;
    border:none;
    border-radius:30px;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    background:linear-gradient(
        90deg,
        #84fab0,
        #8fd3f4
    );
    transition:0.4s;
}

button:hover{
    transform:translateY(-3px);
    box-shadow:0 0 25px #84fab0;
}

a{
    text-decoration:none;
    color:#84fab0;
}

.forgot{
    display:block;
    margin-top:15px;
}

.register{
    margin-top:20px;
    color:white;
}
.particle{
    position:absolute;
    border-radius:50%;
    background:rgba(255,255,255,0.2);
    animation:rise 12s linear infinite;
}

.p1{
    width:15px;
    height:15px;
    left:10%;
    bottom:-20px;
}

.p2{
    width:25px;
    height:25px;
    left:30%;
    bottom:-40px;
    animation-delay:2s;
}

.p3{
    width:20px;
    height:20px;
    left:55%;
    bottom:-30px;
    animation-delay:4s;
}

.p4{
    width:12px;
    height:12px;
    left:75%;
    bottom:-20px;
    animation-delay:6s;
}

.p5{
    width:18px;
    height:18px;
    left:90%;
    bottom:-40px;
    animation-delay:8s;
}

@keyframes rise{
    from{
        transform:translateY(0);
        opacity:0;
    }
    20%{
        opacity:1;
    }
    to{
        transform:translateY(-110vh);
        opacity:0;
    }
}
.divider{
    margin:20px 0;
    color:#cbd5e1;
    position:relative;
}

.divider::before,
.divider::after{
    content:"";
    position:absolute;
    top:50%;
    width:40%;
    height:1px;
    background:rgba(255,255,255,0.2);
}

.divider::before{
    left:0;
}

.divider::after{
    right:0;
}


.social{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:12px;
    cursor:pointer;
    font-size:15px;
    font-weight:600;
    color:white;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15);
    backdrop-filter:blur(10px);
    transition:0.3s;
}

.social:hover{
    transform:translateY(-2px);
    background:rgba(255,255,255,0.15);
}

.forgot{
    display:block;
    text-align:center;
    margin-top:15px;
}

.register{
    margin-top:15px;
    color:white;
    text-align:center;
}
</style>
</head>

<body>
    

    <div class="particle p1"></div>
<div class="particle p2"></div>
<div class="particle p3"></div>
<div class="particle p4"></div>
<div class="particle p5"></div>

<div class="container">
    

    <div class="logo">Auralyx</div>
    <div class="tagline">Feel Every Beat</div>

    <input type="text" placeholder="Username">

    <input type="password" placeholder="Password">

    <button>Log In</button>

<div class="divider">
    <span>OR</span>
</div>

<button class="social">🔍 Continue with Google</button>

<button class="social">📘 Continue with Facebook</button>

<button class="social">🍎 Continue with Apple</button>

<a href="forgot.html" class="forgot">Forgot Password?</a>


    <div class="register">
        Don't have an account?
        <a href="register.html">Register</a>
    </div>

</div>

</body>
</html>
